<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Artem</title>
  <desc id="d">Applied AI builder. A cash balance line dips below zero and a risk marker flags the cash gap.</desc>
  <style>
    .name{font:700 58px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0f172a}
    .tag{font:400 22px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0f172a}
    .meta{font:400 16px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#57606a}
    .mono{font:500 14px ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;letter-spacing:2px;fill:#0d9488}
    .small{font:400 12px ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:#57606a}
    .risk{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:#dc2626}
    .line{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 3s ease-out .3s both}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out 3.2s infinite;opacity:0}
    @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
    @keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
    @media (prefers-reduced-motion:reduce){.line,.pulse{animation:none}}
  </style>
  <rect x=".5" y=".5" width="1199" height="319" rx="20" fill="#f6f8fa" stroke="#d0d7de"/>
  <g stroke="#e4e9ee" stroke-width="1">
    <line x1="700" y1="80" x2="1136" y2="80"/><line x1="700" y1="130" x2="1136" y2="130"/>
    <line x1="700" y1="230" x2="1136" y2="230"/><line x1="700" y1="280" x2="1136" y2="280"/>
  </g>
  <line x1="700" y1="180" x2="1136" y2="180" stroke="#57606a" stroke-width="1.2" stroke-dasharray="5 5"/>
  <text class="small" x="704" y="172">balance = 0</text>
  <path class="line" pathLength="1" d="M700,118 C740,90 780,92 820,122 S900,176 930,206 S985,246 1015,214 S1085,120 1136,104"
        fill="none" stroke="#0d9488" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="pulse" cx="962" cy="232" r="7" fill="#dc2626"/>
  <circle cx="962" cy="232" r="6" fill="#dc2626"/>
  <text class="risk" x="976" y="258">cash gap</text>
  <text class="mono" x="64" y="92">APPLIED AI  /  LLM TOOLING  /  AUTOMATION</text>
  <text class="name" x="64" y="168">Artem</text>
  <text class="tag" x="64" y="214">I build LLM-powered tools and agents.</text>
  <text class="meta" x="64" y="252">@lcvtlcl   |   Go · Python · LLM agents</text>
</svg>

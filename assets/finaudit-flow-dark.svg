<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-labelledby="t d">
  <title id="t">How FinAudit splits the work</title>
  <desc id="d">A bank statement goes to a Go rules engine that calculates metrics and risk flags. An LLM then explains the aggregated results in a plain-language report.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#8b98a9"/></marker></defs>
  <rect x=".5" y=".5" width="999" height="229" rx="18" fill="#0b1220" stroke="#1f2a3a"/>
  <rect x="25" y="46" width="200" height="104" rx="14" fill="#111b2b" stroke="#8b98a9" stroke-width="2"/>
  <text x="125" y="84" text-anchor="middle" style="font:700 19px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3">Bank statement</text>
  <text x="125" y="110" text-anchor="middle" style="font:400 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b98a9">uploaded</text>
  <text x="125" y="130" text-anchor="middle" style="font:400 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b98a9">by the user</text>
<line x1="231" y1="98" x2="269" y2="98" stroke="#8b98a9" stroke-width="2" marker-end="url(#a)"/>
  <rect x="275" y="46" width="200" height="104" rx="14" fill="#111b2b" stroke="#2dd4bf" stroke-width="2"/>
  <text x="375" y="84" text-anchor="middle" style="font:700 19px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3">Go rules engine</text>
  <text x="375" y="110" text-anchor="middle" style="font:400 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b98a9">metrics and</text>
  <text x="375" y="130" text-anchor="middle" style="font:400 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b98a9">risk flags</text>
<line x1="481" y1="98" x2="519" y2="98" stroke="#8b98a9" stroke-width="2" marker-end="url(#a)"/>
  <rect x="525" y="46" width="200" height="104" rx="14" fill="#111b2b" stroke="#a78bfa" stroke-width="2"/>
  <text x="625" y="84" text-anchor="middle" style="font:700 19px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3">LLM</text>
  <text x="625" y="110" text-anchor="middle" style="font:400 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b98a9">explains the</text>
  <text x="625" y="130" text-anchor="middle" style="font:400 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b98a9">aggregated results</text>
<line x1="731" y1="98" x2="769" y2="98" stroke="#8b98a9" stroke-width="2" marker-end="url(#a)"/>
  <rect x="775" y="46" width="200" height="104" rx="14" fill="#111b2b" stroke="#8b98a9" stroke-width="2"/>
  <text x="875" y="84" text-anchor="middle" style="font:700 19px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3">Report</text>
  <text x="875" y="110" text-anchor="middle" style="font:400 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b98a9">plain-language</text>
  <text x="875" y="130" text-anchor="middle" style="font:400 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b98a9">cash-gap warnings</text>
  <text x="375" y="176" text-anchor="middle" style="font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:#2dd4bf">DETERMINISTIC</text>
  <text x="625" y="176" text-anchor="middle" style="font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:#a78bfa">LANGUAGE</text>
  <text x="500" y="208" text-anchor="middle" style="font:400 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3">Numbers come from code. The model explains them.</text>
</svg>
